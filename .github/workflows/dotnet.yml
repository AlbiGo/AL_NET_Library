# This workflow builds the curriculum solution on .NET 8.

name: .NET

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore AL_NET_Library.sln
    - name: Build
      run: dotnet build AL_NET_Library.sln --no-restore --configuration Release
    - name: Test
      run: dotnet test AL_NET_Library.sln --no-build --configuration Release --verbosity minimal
